<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1d4785"/>
      <stop offset="0.5" stop-color="#0a1c3d"/>
      <stop offset="1" stop-color="#02050b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.28" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#2bb5b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2bb5b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.82" cy="0.88" r="0.55">
      <stop offset="0" stop-color="#6e5bd6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6e5bd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="glassBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#b7e8f2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <filter id="glyphGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glowA)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowB)"/>
    <!-- edge light -->
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

    <!-- fanned cards behind -->
    <g transform="rotate(-14 512 560)">
      <rect x="318" y="292" width="388" height="476" rx="70" fill="url(#glassBack)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
    </g>
    <g transform="rotate(10 512 560)">
      <rect x="318" y="292" width="388" height="476" rx="70" fill="url(#glassBack)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
    </g>

    <!-- front glass card -->
    <g filter="url(#cardShadow)">
      <rect x="306" y="252" width="412" height="512" rx="76" fill="#0d1d33" fill-opacity="0.55"/>
    </g>
    <rect x="306" y="252" width="412" height="512" rx="76" fill="url(#glass)"/>
    <rect x="307.5" y="253.5" width="409" height="509" rx="74.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <path d="M360 300 Q 512 268 664 300" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- selection brackets -->
    <g stroke="#b7e8f2" stroke-width="12" stroke-linecap="round" fill="none" stroke-opacity="0.9">
      <path d="M368 372 v-36 a20 20 0 0 1 20 -20 h36"/>
      <path d="M656 372 v-36 a20 20 0 0 0 -20 -20 h-36"/>
      <path d="M368 644 v36 a20 20 0 0 0 20 20 h36"/>
      <path d="M656 644 v36 a20 20 0 0 1 -20 20 h-36"/>
    </g>

    <!-- scissors (Lucide, ISC) -->
    <g filter="url(#glyphGlow)" transform="translate(392 388) scale(10)" fill="none" stroke="#e9fbff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="6" r="3"/>
      <circle cx="6" cy="18" r="3"/>
      <path d="M20 4 8.12 15.88"/>
      <path d="M14.47 14.48 20 20"/>
      <path d="M8.12 8.12 12 12"/>
    </g>
  </g>
</svg>
